# Dependabot moves one reference in this repository: the pinned `agents-sync.yml` caller.
#
# Updates are proposed as pull requests only and never merge on their own.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    # Only the one reference this file exists for. The actions in `validate.yml` are not
    # proposed by this entry.
    allow:
      - dependency-name: 'bymaxone/.github*'
    groups:
      # `agents-sync.yml` is the one Bymax reusable a caller pins to a commit: it is handed the sync
      # App's private key (see "agents-sync" in the README of bymaxone/.github). This group moves
      # that SHA in a pull request of its own, to the newest release of the same major. The other
      # Bymax reusables stay on `@v1`, which Dependabot leaves alone.
      bymax-agents-sync:
        patterns:
          - 'bymaxone/.github/.github/workflows/agents-sync.yml'
    ignore:
      # A new major is a deliberate migration, never an automatic bump.
      - dependency-name: 'bymaxone/.github*'
        update-types: ['version-update:semver-major']
