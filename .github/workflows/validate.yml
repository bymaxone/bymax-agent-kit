name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the default GITHUB_TOKEN. Every step here only reads the
# repository — checkout, a toolchain install, and a local script — so nothing
# needs write access. Declared at workflow level rather than per job so any job
# added later inherits the restriction instead of silently getting the default.
permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace + plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code
        # validate.sh delegates marketplace and plugin checks to `claude plugin validate`
        # so the validation tracks whatever schema the installed CLI expects.
        run: npm install -g @anthropic-ai/claude-code

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install PyYAML
        # Required, not optional: check-frontmatter.py parses YAML with it and
        # fails closed without it, rather than shipping a second hand-written
        # parser whose verdict differed from PyYAML's in both directions.
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Run validate.sh
        # Delegates to `claude plugin validate` for marketplace/plugin manifests, then
        # checks shell-script executable bits, shellcheck, command/skill/agent
        # frontmatter, and required project files.
        run: ./scripts/validate.sh

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Validate Codex package and isolated installation
        env:
          BYMAX_REQUIRE_CODEX_TEST: '1'
        run: ./scripts/validate-codex.sh
